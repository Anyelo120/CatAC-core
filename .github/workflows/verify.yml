name: Verify CatAC 2.0
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp clean install
      - run: ./mvnw -B -ntp -f examples/consumer/pom.xml clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: |
            target/surefire-reports/
            examples/consumer/target/surefire-reports/
            target/benchmark.json
            target/catac-core-*.jar
